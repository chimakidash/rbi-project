events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/nginx.crt;
        ssl_certificate_key /etc/nginx/nginx.key;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /user1/  { proxy_pass http://user1:3000/; }
        location /user2/  { proxy_pass http://user2:3000/; }
        location /user3/  { proxy_pass http://user3:3000/; }
        location /user4/  { proxy_pass http://user4:3000/; }
        location /user5/  { proxy_pass http://user5:3000/; }
        location /user6/  { proxy_pass http://user6:3000/; }
        location /user7/  { proxy_pass http://user7:3000/; }
        location /user8/  { proxy_pass http://user8:3000/; }
        location /user9/  { proxy_pass http://user9:3000/; }
        location /user10/ { proxy_pass http://user10:3000/; }
        location /user11/ { proxy_pass http://user11:3000/; }
        location /user12/ { proxy_pass http://user12:3000/; }
        location /user13/ { proxy_pass http://user13:3000/; }
        location /user14/ { proxy_pass http://user14:3000/; }
        location /user15/ { proxy_pass http://user15:3000/; }
        location /user16/ { proxy_pass http://user16:3000/; }
        location /user17/ { proxy_pass http://user17:3000/; }
        location /user18/ { proxy_pass http://user18:3000/; }
        location /user19/ { proxy_pass http://user19:3000/; }
        location /user20/ { proxy_pass http://user20:3000/; }
    }
}